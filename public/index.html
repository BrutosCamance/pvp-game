<!DOCTYPE html>
<html>
<head>
  <title>PvP Arena Ultimate Deluxe</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: radial-gradient(circle, #1a252f 0%, #0d1117 100%); color: white; margin: 0; padding: 10px; }
    #app { max-width: 1120px; margin: 0 auto; }
    .hidden { display: none !important; }
    
    .game-layout { display: flex; gap: 15px; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
    .main-game-area { flex: 1; min-width: 800px; max-width: 800px; }

    #board-container {
      position: relative; width: 800px; height: 500px; background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
      border: 6px solid #1e8449; border-radius: 12px; margin: 10px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 100px 100px; 
    }

    #plant-zone { position: absolute; left: 0; width: 400px; height: 500px; background: rgba(46, 204, 113, 0.15); z-index: 1; pointer-events: none; }
    #zombie-zone { position: absolute; right: 0; width: 400px; height: 500px; background: rgba(142, 68, 173, 0.15); z-index: 1; pointer-events: none; }

    .unit {
      position: absolute; width: 100px; height: 100px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 38px;
      transition: left 0.4s ease-in-out, top 0.4s ease-in-out; z-index: 10;
    }
    
    /* Standard / Menu buttons keep normal size */
    .menu-btn img { width: 40px; height: 40px; object-fit: contain; display: inline-block; vertical-align: middle; }
    
    /* In-game board units using images are scaled up by 1.5x (60px) */
    .unit img { width: 60px; height: 60px; object-fit: contain; display: inline-block; vertical-align: middle; }

    .hp-bar-container { width: 65px; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; margin-top: -2px; border: 1px solid rgba(255,255,255,0.2); }
    .hp-fill { height: 100%; background: #2ecc71; width: 100%; transition: width 0.3s; }
    .hp-text { font-size: 10px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px black; margin-top: 1px; }

    .projectile { position: absolute; width: 14px; height: 14px; background: #f1c40f; border-radius: 50%; z-index: 15; box-shadow: 0 0 8px #f1c40f; transition: left 0.25s linear; }
    
    .explosion {
      position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #f39c12 0%, #e74c3c 60%, rgba(231,76,60,0) 100%);
      border-radius: 50%; z-index: 30; animation: explodeAnim 0.5s ease-out forwards; pointer-events: none;
    }
    @keyframes explodeAnim {
      0% { transform: scale(0.2); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.9; }
      100% { transform: scale(2); opacity: 0; }
    }

    .floating-text {
      position: absolute; font-size: 13px; font-weight: bold; z-index: 25; text-shadow: 1px 1px 2px black;
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 1; }
      100% { transform: translateY(-35px) scale(1); opacity: 0; }
    }

    .click-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 100px); grid-template-rows: repeat(5, 100px); z-index: 20; }
    .click-cell { width: 100px; height: 100px; cursor: pointer; transition: background 0.2s; }
    .click-cell:hover { background: rgba(255, 255, 255, 0.25); box-shadow: inset 0 0 10px rgba(255,255,255,0.4); }

    .panel { background: rgba(44, 62, 80, 0.95); padding: 20px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #4e6d8c; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .menu-bar { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .menu-btn { padding: 10px 16px; background: #34495e; border: 2px solid #7f8c8d; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: bold; color: white; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .menu-btn:hover { transform: translateY(-2px); border-color: #f1c40f; }
    .menu-btn.selected { border-color: #e74c3c; background: #d35400; box-shadow: 0 0 10px rgba(211, 84, 0, 0.6); }
    
    .settings-group { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 6px; }
    .settings-group input { width: 140px; padding: 6px; text-align: center; font-weight: bold; border-radius: 4px; border: 1px solid #7f8c8d; background: #2c3e50; color: white; }

    .player-status { padding: 12px; border-radius: 8px; background: #415b76; font-weight: bold; margin: 10px 0; font-size: 16px; }
    .ready-yes { background: #27ae60 !important; color: white; box-shadow: 0 0 15px rgba(39, 174, 96, 0.6); }

    /* Live Chat Styles */
    .chat-panel { width: 280px; height: 602px; display: flex; flex-direction: column; background: rgba(30, 42, 56, 0.95); border: 1px solid #4e6d8c; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden; text-align: left; }
    .chat-header { padding: 12px; background: #243342; font-weight: bold; border-bottom: 1px solid #4e6d8c; font-size: 14px; text-align: center; }
    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .chat-msg { background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 6px; word-break: break-word; line-height: 1.3; }
    
    /* Distinct Colors for Chat Names */
    .chat-name-plants { font-weight: bold; color: #2ecc71; text-shadow: 0 0 5px rgba(46, 204, 113, 0.4); }
    .chat-name-zombies { font-weight: bold; color: #e74c3c; text-shadow: 0 0 5px rgba(231, 76, 60, 0.4); }

    .chat-input-area { display: flex; padding: 10px; background: #243342; border-top: 1px solid #4e6d8c; gap: 6px; }
    .chat-input-area input { flex: 1; padding: 8px; background: #2c3e50; border: 1px solid #7f8c8d; border-radius: 6px; color: white; font-size: 12px; outline: none; }
    .chat-input-area button { padding: 8px 12px; background: #27ae60; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 12px; }
    .chat-input-area button:hover { background: #229954; }

    .overlay-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
      color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>🌱 PvZ Arena: Ultimate Temuu Edition by Lawrence🧟</h1>
    
    <!-- MAIN MENU -->
    <div id="main-menu" class="panel">
      <h2>Main Menu & Customization</h2>
      
      <div style="margin-bottom: 15px;">
        <label><strong>Your Name:</strong></label>
        <input type="text" id="main-player-name" value="Player 1" onchange="saveSettings()" style="padding: 6px; border-radius: 4px; background: #2c3e50; color: white; border: 1px solid #7f8c8d; width: 150px; text-align: center;">
      </div>

      <button class="menu-btn selected" style="font-size: 18px; padding: 12px 30px;" onclick="goToLobby()">Play Game</button>
      
      <div style="display: flex; gap: 20px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
        <div style="text-align: left; max-width: 380px;">
          <h3>Match Settings</h3>
          <div class="settings-group"><label>Starting Currency:</label><input type="number" id="setting-start" value="100" onchange="saveSettings()"></div>
          <div class="settings-group"><label>Currency Gain:</label><input type="number" id="setting-amount" value="10" onchange="saveSettings()"></div>
          <div class="settings-group"><label>Kill Reward:</label><input type="number" id="setting-kill" value="15" onchange="saveSettings()"></div>
          <div class="settings-group"><label>Timer (Seconds):</label><input type="number" id="setting-duration" value="180" onchange="saveSettings()"></div>
        </div>

        <div style="text-align: left; max-width: 380px;">
          <h3>Custom Icons (Emoji or Image URL)</h3>
          <div class="settings-group"><label>🌱 Peashooter:</label><input type="text" id="icon-peashooter" value="🌱" onchange="saveSettings()"></div>
          <div class="settings-group"><label>🥔 Wall-nut:</label><input type="text" id="icon-wallnut" value="🥔" onchange="saveSettings()"></div>
          <div class="settings-group"><label>🌻 Sunflower:</label><input type="text" id="icon-sunflower" value="🌻" onchange="saveSettings()"></div>
          <div class="settings-group"><label>🌶️ Hot Chili:</label><input type="text" id="icon-chili" value="🌶️" onchange="saveSettings()"></div>
          <div class="settings-group"><label>🧟 Basic Zombie:</label><input type="text" id="icon-zombie" value="🧟" onchange="saveSettings()"></div>
          <div class="settings-group"><label>👹 Tank Zombie:</label><input type="text" id="icon-tank" value="👹" onchange="saveSettings()"></div>
          <div class="settings-group"><label>🏃 Runner Zombie:</label><input type="text" id="icon-runner" value="🏃" onchange="saveSettings()"></div>
          <div class="settings-group"><label>⛏️ Miner Zombie:</label><input type="text" id="icon-miner" value="⛏️" onchange="saveSettings()"></div>
        </div>
      </div>
    </div>

    <!-- LOBBY -->
    <div id="lobby" class="hidden panel">
      <h2>Battle Lobby</h2>
      <div style="margin: 10px 0;">
        <label><strong>Change Name:</strong></label>
        <input type="text" id="lobby-player-name" value="Player 1" onchange="updatePlayerName()" style="padding: 6px; border-radius: 4px; background: #2c3e50; color: white; border: 1px solid #7f8c8d; width: 150px; text-align: center;">
      </div>

      <div id="role-select-box" style="margin: 15px 0;">
        <h3>Choose Your Faction</h3>
        <button class="menu-btn" id="btn-faction-plants" onclick="joinRole('Plants')">🌿 Play as Plants</button>
        <button class="menu-btn" id="btn-faction-zombies" onclick="joinRole('Zombies')">🧟 Play as Zombies</button>
      </div>

      <div id="p1-status" class="player-status">Plants (P1): Waiting...</div>
      <div id="p2-status" class="player-status">Zombies (P2): Waiting...</div>
      
      <button id="ready-btn" class="menu-btn selected hidden" style="margin-top: 15px; font-size: 18px;" onclick="setReady()">I'm Ready to Fight!</button>
      <br><br>
      <button class="menu-btn" onclick="exitToMenu()">Back to Main Menu</button>
    </div>

    <!-- GAME BOARD & CHAT LAYOUT -->
    <div id="game" class="hidden">
      <div class="game-layout">
        <div class="main-game-area">
          <div class="panel" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div>
              <p style="font-size: 15px; margin: 0;">
                ☀️ <strong>Sun:</strong> <span id="sun-count" style="color:#f1c40f;">0</span> &nbsp;|&nbsp; 
                🧠 <strong>Brains:</strong> <span id="brains-count" style="color:#e74c3c;">0</span> &nbsp;|&nbsp;
                ⏱️ <strong>Time:</strong> <span id="timer-count" style="color:#3498db;">0:00</span>
              </p>
            </div>
            <div>
              <button class="menu-btn" onclick="togglePause()">⏸ Pause</button>
              <button class="menu-btn" onclick="exitToMenu()" style="border-color: #e74c3c;">🚪 Exit</button>
            </div>
          </div>

          <!-- PLANTS MENU -->
          <div id="plants-menu" class="menu-bar hidden panel" style="margin-bottom: 10px;">
            <button id="btn-peashooter" class="menu-btn selected" onclick="selectUnit('peashooter')"><span id="lbl-peashooter">🌱</span> Peashooter <br><small>Cost: 25</small></button>
            <button id="btn-wallnut" class="menu-btn" onclick="selectUnit('wallnut')"><span id="lbl-wallnut">🥔</span> Wall-nut <br><small>Cost: 50</small></button>
            <button id="btn-sunflower" class="menu-btn" onclick="selectUnit('sunflower')"><span id="lbl-sunflower">🌻</span> Sunflower <br><small>Cost: 25 (Sun Gen)</small></button>
            <button id="btn-chili" class="menu-btn" onclick="selectUnit('chili')"><span id="lbl-chili">🌶️</span> Hot Chili <br><small>Cost: 75 (2s Bomb)</small></button>
          </div>

          <!-- ZOMBIES MENU -->
          <div id="zombies-menu" class="menu-bar hidden panel" style="margin-bottom: 10px;">
            <button id="btn-zombie" class="menu-btn selected" onclick="selectUnit('zombie')"><span id="lbl-zombie">🧟</span> Basic Zombie <br><small>Cost: 25</small></button>
            <button id="btn-tank" class="menu-btn" onclick="selectUnit('tank')"><span id="lbl-tank">👹</span> Tank Zombie <br><small>Cost: 50</small></button>
            <button id="btn-runner" class="menu-btn" onclick="selectUnit('runner')"><span id="lbl-runner">🏃</span> Runner <br><small>Cost: 30 (Fast)</small></button>
            <button id="btn-miner" class="menu-btn" onclick="selectUnit('miner')"><span id="lbl-miner">⛏️</span> Miner <br><small>Cost: 60 (Jumps)</small></button>
          </div>

          <div id="board-container" style="margin: 0 auto;">
            <div id="plant-zone" class="hidden"></div>
            <div id="zombie-zone" class="hidden"></div>

            <div id="units-layer"></div>
            <div class="click-grid" id="click-grid"></div>
            
            <div id="pause-screen" class="hidden overlay-screen">
              <h1>Game Paused</h1>
              <button class="menu-btn selected" onclick="togglePause()" style="margin-bottom: 10px;">Resume Game</button>
              <button class="menu-btn" onclick="exitToMenu()">Quit to Menu</button>
            </div>

            <div id="gameover-screen" class="hidden overlay-screen">
              <h1 id="winner-text" style="font-size: 42px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,255,255,0.5);"></h1>
              <button class="menu-btn selected" onclick="resetGame()" style="margin-bottom: 10px;">Play Again</button>
              <button class="menu-btn" onclick="exitToMenu()">Main Menu</button>
            </div>
          </div>
        </div>

        <!-- LIVE CHAT BOX -->
        <div class="chat-panel">
          <div class="chat-header">💬 Live Match Chat</div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="handleChatKey(event)">
            <button onclick="sendChatMessage()">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myRole = '';
    let selectedUnit = '';

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      let now = audioCtx.currentTime;
      
      if (type === 'spawn') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    }

    function renderIcon(val) {
      if (!val) return '❓';
      if (val.startsWith('http://') || val.startsWith('https://') || val.startsWith('data:')) {
        return `<img src="${val}">`;
      }
      return val;
    }

    function saveSettings() {
      let settings = {
        startingSun: parseInt(document.getElementById('setting-start').value) || 100,
        startingBrains: parseInt(document.getElementById('setting-start').value) || 100,
        generationInterval: 1000,
        generationAmount: parseInt(document.getElementById('setting-amount').value) || 10,
        killReward: parseInt(document.getElementById('setting-kill').value) || 15,
        matchDuration: parseInt(document.getElementById('setting-duration').value) || 180,
        icons: {
          peashooter: document.getElementById('icon-peashooter').value || '🌱',
          wallnut: document.getElementById('icon-wallnut').value || '🥔',
          sunflower: document.getElementById('icon-sunflower').value || '🌻',
          chili: document.getElementById('icon-chili').value || '🌶️',
          zombie: document.getElementById('icon-zombie').value || '🧟',
          tank: document.getElementById('icon-tank').value || '👹',
          runner: document.getElementById('icon-runner').value || '🏃',
          miner: document.getElementById('icon-miner').value || '⛏️'
        }
      };

      ['peashooter', 'wallnut', 'sunflower', 'chili', 'zombie', 'tank', 'runner', 'miner'].forEach(u => {
        let lbl = document.getElementById('lbl-' + u);
        if (lbl) {
          lbl.innerHTML = renderIcon(settings.icons[u]);
        }
      });

      let nameVal = document.getElementById('main-player-name').value;
      document.getElementById('lobby-player-name').value = nameVal;

      socket.emit('updateSettings', settings);
    }

    function updatePlayerName() {
      let name = document.getElementById('lobby-player-name').value;
      document.getElementById('main-player-name').value = name;
      socket.emit('updateNames', { role: myRole, name: name });
    }

    function goToLobby() { socket.emit('goToLobby'); }
    function exitToMenu() { myRole = ''; socket.emit('exitGame'); }
    function togglePause() { socket.emit('pauseGame'); }

    function joinRole(role) {
      myRole = role;
      selectedUnit = role === 'Plants' ? 'peashooter' : 'zombie';
      let name = document.getElementById('lobby-player-name').value;
      socket.emit('join', { role: role, name: name });
      
      document.getElementById('btn-faction-plants').classList.toggle('selected', role === 'Plants');
      document.getElementById('btn-faction-zombies').classList.toggle('selected', role === 'Zombies');
      document.getElementById('ready-btn').classList.remove('hidden');
      playSound('spawn');
    }

    function setReady() { socket.emit('ready', myRole); playSound('spawn'); }

    function selectUnit(unitName) {
      selectedUnit = unitName;
      document.querySelectorAll('.menu-bar .menu-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('btn-' + unitName).classList.add('selected');
      playSound('spawn');
    }

    function attemptSpawn(x, y) { socket.emit('spawn', { role: myRole, x: x, y: y, unitType: selectedUnit }); }
    function resetGame() { socket.emit('reset'); }

    function sendChatMessage() {
      let input = document.getElementById('chat-input');
      let text = input.value.trim();
      if (!text) return;
      socket.emit('sendChat', { role: myRole, text: text });
      input.value = '';
    }

    function handleChatKey(e) {
      if (e.key === 'Enter') sendChatMessage();
    }

    function buildClickGrid() {
      const grid = document.getElementById('click-grid');
      grid.innerHTML = '';
      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 8; x++) {
          let cell = document.createElement('div');
          cell.className = 'click-cell';
          cell.onclick = () => attemptSpawn(x, y);
          grid.appendChild(cell);
        }
      }
    }
    buildClickGrid();

    socket.on('stateUpdate', (state) => {
      document.getElementById('main-menu').classList.toggle('hidden', state.status !== 'menu');
      document.getElementById('lobby').classList.toggle('hidden', state.status !== 'lobby');
      document.getElementById('game').classList.toggle('hidden', state.status === 'menu' || state.status === 'lobby');
      document.getElementById('pause-screen').classList.toggle('hidden', state.status !== 'paused');
      document.getElementById('gameover-screen').classList.toggle('hidden', state.status !== 'gameover');

      if (state.status === 'lobby') {
        let p1El = document.getElementById('p1-status');
        let p2El = document.getElementById('p2-status');
        let p1Name = state.p1.name || 'Plants (P1)';
        let p2Name = state.p2.name || 'Zombies (P2)';

        if (state.p1.ready) { p1El.innerText = `${p1Name}: READY! ✅`; p1El.classList.add('ready-yes'); }
        else { p1El.innerText = `${p1Name}: Waiting...`; p1El.classList.remove('ready-yes'); }

        if (state.p2.ready) { p2El.innerText = `${p2Name}: READY! ✅`; p2El.classList.add('ready-yes'); }
        else { p2El.innerText = `${p2Name}: Waiting...`; p2El.classList.remove('ready-yes'); }
      }

      if (state.status === 'playing' || state.status === 'paused') {
        if (myRole === 'Plants') {
          document.getElementById('plants-menu').classList.remove('hidden');
          document.getElementById('plant-zone').classList.remove('hidden');
          document.getElementById('zombies-menu').classList.add('hidden');
          document.getElementById('zombie-zone').classList.add('hidden');
        } else {
          document.getElementById('zombies-menu').classList.remove('hidden');
          document.getElementById('zombie-zone').classList.remove('hidden');
          document.getElementById('plants-menu').classList.add('hidden');
          document.getElementById('plant-zone').classList.add('hidden');
        }

        document.getElementById('sun-count').innerText = state.sun;
        document.getElementById('brains-count').innerText = state.brains;

        let totalSecs = state.settings.matchDuration || 180;
        let elapsed = Math.floor((Date.now() - state.startTime) / 1000);
        let remaining = Math.max(0, totalSecs - elapsed);
        let mins = Math.floor(remaining / 60);
        let secs = remaining % 60;
        document.getElementById('timer-count').innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

        updateUnits(state.board);
        if (state.projectiles && state.projectiles.length > 0) drawProjectiles(state.projectiles);
        if (state.floatingTexts && state.floatingTexts.length > 0) drawFloatingTexts(state.floatingTexts);
        if (state.explosions && state.explosions.length > 0) drawExplosions(state.explosions);
        updateChat(state.chatMessages);
      }

      if (state.status === 'gameover') {
        document.getElementById('winner-text').innerText = "🏆 " + state.winner;
      }
    });

    function updateChat(messages) {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      messages.forEach(m => {
        let div = document.createElement('div');
        div.className = 'chat-msg';
        let colorClass = m.role === 'Plants' ? 'chat-name-plants' : 'chat-name-zombies';
        div.innerHTML = `<span class="${colorClass}">${m.sender}:</span> ${m.text}`;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function updateUnits(serverUnits) {
      const layer = document.getElementById('units-layer');
      let currentElements = Array.from(layer.children).filter(el => el.classList.contains('unit'));
      let serverIds = serverUnits.map(u => 'unit-' + u.id);

      currentElements.forEach(el => {
        if (!serverIds.includes(el.id)) layer.removeChild(el);
      });

      serverUnits.forEach(unit => {
        let maxHp = unit.maxHp || 5;
        let hpPercent = Math.max(0, (unit.hp / maxHp) * 100);

        let el = document.getElementById('unit-' + unit.id);
        if (!el) {
          el = document.createElement('div');
          el.id = 'unit-' + unit.id;
          el.className = 'unit';
          
          let icon = document.createElement('div');
          icon.id = 'icon-div-' + unit.id;
          
          let hpContainer = document.createElement('div');
          hpContainer.className = 'hp-bar-container';
          
          let hpFill = document.createElement('div');
          hpFill.className = 'hp-fill';
          hpFill.id = 'hp-fill-' + unit.id;
          hpContainer.appendChild(hpFill);

          let hpText = document.createElement('div');
          hpText.className = 'hp-text';
          hpText.id = 'hp-text-' + unit.id;
          
          el.appendChild(icon);
          el.appendChild(hpContainer);
          el.appendChild(hpText);
          layer.appendChild(el);
        }

        let iconDiv = document.getElementById('icon-div-' + unit.id);
        iconDiv.innerHTML = renderIcon(unit.sprite);

        document.getElementById('hp-fill-' + unit.id).style.width = hpPercent + '%';
        document.getElementById('hp-text-' + unit.id).innerText = unit.hp + ' HP';
        el.style.left = (unit.x * 100) + 'px';
        el.style.top = (unit.y * 100) + 'px';
      });
    }

    function drawProjectiles(projectiles) {
      const layer = document.getElementById('units-layer');
      playSound('shoot');
      projectiles.forEach(p => {
        let dot = document.createElement('div');
        dot.className = 'projectile';
        dot.style.left = (p.x * 100 + 75) + 'px'; 
        dot.style.top = (p.y * 100 + 35) + 'px';
        layer.appendChild(dot);
        setTimeout(() => { dot.style.left = (p.targetX * 100 + 20) + 'px'; }, 30);
        setTimeout(() => { if (dot.parentNode) dot.parentNode.removeChild(dot); }, 280);
      });
    }

    function drawExplosions(explosions) {
      const layer = document.getElementById('units-layer');
      explosions.forEach(e => {
        let exp = document.createElement('div');
        exp.className = 'explosion';
        exp.style.left = (e.x * 100) + 'px';
        exp.style.top = (e.y * 100) + 'px';
        layer.appendChild(exp);
        setTimeout(() => { if (exp.parentNode) exp.parentNode.removeChild(exp); }, 500);
      });
    }

    function drawFloatingTexts(texts) {
      const layer = document.getElementById('units-layer');
      texts.forEach(ft => {
        let span = document.createElement('div');
        span.className = 'floating-text';
        span.innerText = ft.text;
        span.style.color = ft.color;
        span.style.left = (ft.x * 100 + 10) + 'px';
        span.style.top = (ft.y * 100 + 10) + 'px';
        layer.appendChild(span);
        setTimeout(() => { if (span.parentNode) span.parentNode.removeChild(span); }, 900);
      });
    }
  </script>
</body>
</html>
