<!DOCTYPE html>
<html>
<head>
  <title>PvP Arena Deluxe</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: radial-gradient(circle, #1a252f 0%, #0d1117 100%); color: white; margin: 0; padding: 10px; }
    #app { max-width: 840px; margin: 0 auto; }
    .hidden { display: none !important; }
    
    #board-container {
      position: relative; width: 800px; height: 500px; background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
      border: 6px solid #1e8449; border-radius: 12px; margin: 20px auto; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 100px 100px; 
    }

    #plant-zone { position: absolute; left: 0; width: 400px; height: 500px; background: rgba(46, 204, 113, 0.15); z-index: 1; pointer-events: none; }
    #zombie-zone { position: absolute; right: 0; width: 400px; height: 500px; background: rgba(142, 68, 173, 0.15); z-index: 1; pointer-events: none; }

    .unit {
      position: absolute; width: 100px; height: 100px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; font-size: 45px;
      transition: left 0.4s ease-in-out, top 0.4s ease-in-out; z-index: 10;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hp-bar-container { width: 65px; height: 6px; background: rgba(0,0,0,0.6); border-radius: 3px; overflow: hidden; margin-top: -2px; border: 1px solid rgba(255,255,255,0.2); }
    .hp-fill { height: 100%; background: #2ecc71; width: 100%; transition: width 0.3s; }
    .hp-text { font-size: 10px; font-weight: bold; color: #fff; text-shadow: 1px 1px 2px black; margin-top: 1px; }

    .projectile { position: absolute; width: 14px; height: 14px; background: #f1c40f; border-radius: 50%; z-index: 15; box-shadow: 0 0 8px #f1c40f; transition: left 0.25s linear; }

    .click-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 100px); grid-template-rows: repeat(5, 100px); z-index: 20; }
    .click-cell { width: 100px; height: 100px; cursor: pointer; transition: background 0.2s; }
    .click-cell:hover { background: rgba(255, 255, 255, 0.25); box-shadow: inset 0 0 10px rgba(255,255,255,0.4); }

    .panel { background: rgba(44, 62, 80, 0.9); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #4e6d8c; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    .menu-bar { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
    .menu-btn { padding: 12px 20px; background: #34495e; border: 2px solid #7f8c8d; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; color: white; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
    .menu-btn:hover { transform: translateY(-2px); border-color: #f1c40f; }
    .menu-btn.selected { border-color: #e74c3c; background: #d35400; box-shadow: 0 0 10px rgba(211, 84, 0, 0.6); }
    
    .player-status { padding: 12px; border-radius: 8px; background: #415b76; font-weight: bold; margin: 10px 0; font-size: 16px; letter-spacing: 0.5px; }
    .ready-yes { background: #27ae60 !important; color: white; box-shadow: 0 0 15px rgba(39, 174, 96, 0.6); }

    #gameover-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
      color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>🌱 PvZ Arena: Ultimate Clash 🧟</h1>
    
    <div id="role-select" class="panel">
      <h3>Choose Your Faction</h3>
      <button class="menu-btn" onclick="joinRole('Plants')">🌿 Play as Plants</button>
      <button class="menu-btn" onclick="joinRole('Zombies')">🧟 Play as Zombies</button>
    </div>

    <div id="lobby" class="hidden panel">
      <h2>Battle Lobby</h2>
      <div id="p1-status" class="player-status">Plants (P1): Waiting for player...</div>
      <div id="p2-status" class="player-status">Zombies (P2): Waiting for player...</div>
      <button class="menu-btn selected" style="margin-top: 15px; font-size: 18px;" onclick="setReady()">I'm Ready to Fight!</button>
    </div>

    <div id="game" class="hidden">
      <div class="panel">
        <p style="font-size: 18px; margin: 5px 0;">
          ☀️ <strong>Sun:</strong> <span id="sun-count" style="color:#f1c40f;">0</span> &nbsp;|&nbsp; 
          🧠 <strong>Brains:</strong> <span id="brains-count" style="color:#e74c3c;">0</span>
        </p>
        
        <div id="plants-menu" class="menu-bar hidden">
          <button id="btn-peashooter" class="menu-btn selected" onclick="selectUnit('peashooter')">🌱 Peashooter <br><small>Cost: 25</small></button>
          <button id="btn-wallnut" class="menu-btn" onclick="selectUnit('wallnut')">🥔 Wall-nut <br><small>Cost: 50</small></button>
        </div>

        <div id="zombies-menu" class="menu-bar hidden">
          <button id="btn-zombie" class="menu-btn selected" onclick="selectUnit('zombie')">🧟 Basic Zombie <br><small>Cost: 25</small></button>
          <button id="btn-tank" class="menu-btn" onclick="selectUnit('tank')">👹 Tank Zombie <br><small>Cost: 50</small></button>
        </div>
      </div>

      <div id="board-container">
        <div id="plant-zone" class="hidden"></div>
        <div id="zombie-zone" class="hidden"></div>

        <div id="units-layer"></div>
        <div class="click-grid" id="click-grid"></div>
        
        <div id="gameover-screen" class="hidden">
          <h1 id="winner-text" style="font-size: 42px; margin-bottom: 20px; text-shadow: 0 0 10px rgba(255,255,255,0.5);"></h1>
          <button class="menu-btn selected" onclick="resetGame()">Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let myRole = '';
    let selectedUnit = '';

    // Simple Web Audio API Sound Synthesizer (No external asset links required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      let now = audioCtx.currentTime;
      if (type === 'spawn') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'shoot') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    }

    function joinRole(role) {
      myRole = role;
      selectedUnit = role === 'Plants' ? 'peashooter' : 'zombie';
      socket.emit('join', role);
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('lobby').classList.remove('hidden');
      playSound('spawn');
    }

    function setReady() {
      socket.emit('ready', myRole);
      playSound('spawn');
    }

    function selectUnit(unitName) {
      selectedUnit = unitName;
      document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('selected'));
      document.getElementById('btn-' + unitName).classList.add('selected');
      playSound('spawn');
    }

    function attemptSpawn(x, y) {
      socket.emit('spawn', { role: myRole, x: x, y: y, unitType: selectedUnit });
    }

    function resetGame() {
      socket.emit('reset');
    }

    function buildClickGrid() {
      const grid = document.getElementById('click-grid');
      grid.innerHTML = '';
      for (let y = 0; y < 5; y++) {
        for (let x = 0; x < 8; x++) {
          let cell = document.createElement('div');
          cell.className = 'click-cell';
          cell.onclick = () => attemptSpawn(x, y);
          grid.appendChild(cell);
        }
      }
    }
    buildClickGrid();

    socket.on('stateUpdate', (state) => {
      if (state.status === 'lobby') {
        let p1El = document.getElementById('p1-status');
        let p2El = document.getElementById('p2-status');
        if (state.p1.ready) { p1El.innerText = "Plants (P1): READY! ✅"; p1El.classList.add('ready-yes'); }
        if (state.p2.ready) { p2El.innerText = "Zombies (P2): READY! ✅"; p2El.classList.add('ready-yes'); }
      }

      if (state.status === 'playing') {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');

        if (myRole === 'Plants') {
          document.getElementById('plants-menu').classList.remove('hidden');
          document.getElementById('plant-zone').classList.remove('hidden');
        } else {
          document.getElementById('zombies-menu').classList.remove('hidden');
          document.getElementById('zombie-zone').classList.remove('hidden');
        }

        document.getElementById('sun-count').innerText = state.sun;
        document.getElementById('brains-count').innerText = state.brains;

        updateUnits(state.board);
        if (state.projectiles && state.projectiles.length > 0) {
          drawProjectiles(state.projectiles);
        }
      }

      if (state.status === 'gameover') {
        document.getElementById('gameover-screen').classList.remove('hidden');
        document.getElementById('winner-text').innerText = "🏆 " + state.winner;
      } else {
        document.getElementById('gameover-screen').classList.add('hidden');
      }
    });

    function updateUnits(serverUnits) {
      const layer = document.getElementById('units-layer');
      let currentElements = Array.from(layer.children).filter(el => el.classList.contains('unit'));
      let serverIds = serverUnits.map(u => 'unit-' + u.id);

      currentElements.forEach(el => {
        if (!serverIds.includes(el.id)) layer.removeChild(el);
      });

      serverUnits.forEach(unit => {
        let maxHp = unit.name === 'wallnut' ? 10 : (unit.name === 'tank' ? 8 : (unit.name === 'peashooter' ? 3 : 4));
        let hpPercent = Math.max(0, (unit.hp / maxHp) * 100);

        let el = document.getElementById('unit-' + unit.id);
        if (!el) {
          el = document.createElement('div');
          el.id = 'unit-' + unit.id;
          el.className = 'unit';
          
          let icon = document.createElement('div');
          icon.innerText = unit.sprite;
          
          let hpContainer = document.createElement('div');
          hpContainer.className = 'hp-bar-container';
          
          let hpFill = document.createElement('div');
          hpFill.className = 'hp-fill';
          hpFill.id = 'hp-fill-' + unit.id;
          hpContainer.appendChild(hpFill);

          let hpText = document.createElement('div');
          hpText.className = 'hp-text';
          hpText.id = 'hp-text-' + unit.id;
          
          el.appendChild(icon);
          el.appendChild(hpContainer);
          el.appendChild(hpText);
          layer.appendChild(el);
          playSound('spawn');
        }

        document.getElementById('hp-fill-' + unit.id).style.width = hpPercent + '%';
        document.getElementById('hp-text-' + unit.id).innerText = unit.hp + ' HP';
        el.style.left = (unit.x * 100) + 'px';
        el.style.top = (unit.y * 100) + 'px';
      });
    }

    function drawProjectiles(projectiles) {
      const layer = document.getElementById('units-layer');
      playSound('shoot');
      
      projectiles.forEach(p => {
        let dot = document.createElement('div');
        dot.className = 'projectile';
        dot.style.left = (p.x * 100 + 75) + 'px'; 
        dot.style.top = (p.y * 100 + 35) + 'px';
        layer.appendChild(dot);
        
        setTimeout(() => { 
          dot.style.left = (p.targetX * 100 + 20) + 'px'; 
        }, 30);
        
        setTimeout(() => { 
          if (dot.parentNode) dot.parentNode.removeChild(dot); 
        }, 280);
      });
    }
  </script>
</body>
</html>
